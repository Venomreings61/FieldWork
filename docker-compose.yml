services:

  api:
    build:
      context: .
      dockerfile: FieldWork.Api/Dockerfile
    container_name: fieldwork-api
    ports:
      - "5128:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seed__Enabled: "true"
      ConnectionStrings__FieldWorkDb: "Host=db;Port=5432;Database=fieldwork;Username=fieldwork;Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: "FieldWork.Api"
      Jwt__Audience: "FieldWork.Client"
      Jwt__ExpirationMinutes: "60"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      FaceService__BaseUrl: "http://face-service:8500"
      FaceService__TimeoutSeconds: "30"
    depends_on:
      db:
        condition: service_healthy
      face-service:
        condition: service_healthy

  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: fieldwork-face-service
    environment:
      UNIFACE_CACHE_DIR: "/root/.uniface/models"
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: fieldwork-db
    environment:
      POSTGRES_DB: fieldwork
      POSTGRES_USER: fieldwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - fieldwork_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldwork -d fieldwork"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fieldwork_pgdata: