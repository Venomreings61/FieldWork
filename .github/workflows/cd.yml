name: Production CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_API_REPO: fieldwork-api
  ECR_FACE_REPO: fieldwork-face-service
  ECS_CLUSTER: fieldwork-cluster
  API_SERVICE: fieldwork-api
  FACE_SERVICE: fieldwork-face-service

jobs:
  deploy:
    name: Build, Push & Deploy to ECS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f FieldWork.Api/Dockerfile -t $REGISTRY/$ECR_API_REPO:$IMAGE_TAG FieldWork.Api
          docker push $REGISTRY/$ECR_API_REPO:$IMAGE_TAG

      - name: Build and Push Face Service Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f face-service/Dockerfile -t $REGISTRY/$ECR_FACE_REPO:$IMAGE_TAG face-service
          docker push $REGISTRY/$ECR_FACE_REPO:$IMAGE_TAG

      - name: Download & Update API Task Definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: fieldwork-api
          container-name: fieldwork-api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ github.sha }}

      - name: Deploy API to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Download & Update Face Service Task Definition
        id: render-face
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: fieldwork-face-service
          container-name: fieldwork-face-service
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FACE_REPO }}:${{ github.sha }}

      - name: Deploy Face Service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-face.outputs.task-definition }}
          service: ${{ env.FACE_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.API_SERVICE }} ${{ env.FACE_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "All ECS services are stable and healthy."
