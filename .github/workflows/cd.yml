- name: Run Automated AWS Deployment Tests
        env:
          TEST_USERNAME: ${{ secrets.TEST_API_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_API_PASSWORD }}
        run: |
          echo "Target ALB: http://${{ env.ALB_DNS }}"
          
          # 1. ALB Health Check (/health/ready)
          echo "Checking /health/ready..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.ALB_DNS }}/health/ready)
          if [ "$HEALTH_STATUS" -ne 200 ]; then
            echo "Health check failed with status $HEALTH_STATUS"
            exit 1
          fi
          echo "ALB Readiness: PASS"

          # 2. Authentication Login (/api/Auth/login) with Robust Diagnostics & jq
          echo "Testing Authentication..."
          LOGIN_BODY_FILE=$(mktemp)
          
          HTTP_CODE=$(curl -sS \
            -o "$LOGIN_BODY_FILE" \
            -w "%{http_code}" \
            -X POST "http://${{ env.ALB_DNS }}/api/Auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$TEST_USERNAME\",\"password\":\"$TEST_PASSWORD\"}")

          echo "Login HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Login failed."
            echo "➡️ API Response Body:"
            cat "$LOGIN_BODY_FILE"
            rm -f "$LOGIN_BODY_FILE"
            exit 1
          fi

          BODY=$(cat "$LOGIN_BODY_FILE")
          rm -f "$LOGIN_BODY_FILE"

          # Parse token safely via jq
          TOKEN=$(echo "$BODY" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ Login returned HTTP 200 but no token was found in the response body."
            echo "➡️ Response was: $BODY"
            exit 1
          fi
          
          echo "Authentication: PASS"

          # 3. Authenticated /api/Auth/me Check
          echo "Testing /api/Auth/me..."
          ME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" http://${{ env.ALB_DNS }}/api/Auth/me)
          if [ "$ME_STATUS" -ne 200 ]; then
            echo "/api/Auth/me failed with status $ME_STATUS"
            exit 1
          fi
          echo "Auth/me: PASS"

          # 4. Automated Face Verification Test
          echo "Testing Face Verification via Service Connect..."
          TEST_IMAGE="FieldWork.Tests/TestData/personA_1.png"
          if [ -f "$TEST_IMAGE" ]; then
            FACE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://${{ env.ALB_DNS }}/api/Face/verify \
              -H "Authorization: Bearer $TOKEN" \
              -F "image=@$TEST_IMAGE")
            
            FACE_CODE=$(echo "$FACE_RESPONSE" | tail -n1)
            FACE_BODY=$(echo "$FACE_RESPONSE" | sed '$d')

            if [ "$FACE_CODE" -eq 200 ] && echo "$FACE_BODY" | grep -q "true"; then
              FACE_VERIFY_STATUS="PASS"
            else
              echo "Face verification response: $FACE_BODY"
              FACE_VERIFY_STATUS="FAIL"
              exit 1
            fi
          else
            echo "Test image not found at $TEST_IMAGE, skipping automated face payload check."
            FACE_VERIFY_STATUS="SKIPPED"
          fi

          # Print Portfolio Summary Block
          echo "================================="
          echo "FieldWork AWS Deployment Test"
          echo "================================="
          echo "ECS API              PASS"
          echo "ECS Face Service     PASS"
          echo "ALB readiness        PASS"
          echo "Authentication       PASS"
          echo "Auth/me              PASS"
          echo "Face verification    $FACE_VERIFY_STATUS"
          echo ""
          echo "Deployment successful."
          echo "================================="
