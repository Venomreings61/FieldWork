name: Production CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_API_REPO: fieldwork-api
  ECR_FACE_REPO: fieldwork-face-service
  ECS_CLUSTER: fieldwork-cluster
  API_SERVICE: fieldwork-api
  FACE_SERVICE: fieldwork-face-service

jobs:
  deploy:
    name: Build, Push & Deploy to ECS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f FieldWork.Api/Dockerfile -t $REGISTRY/$ECR_API_REPO:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_API_REPO:$IMAGE_TAG

      - name: Build and Push Face Service Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f face-service/Dockerfile -t $REGISTRY/$ECR_FACE_REPO:$IMAGE_TAG face-service
          docker push $REGISTRY/$ECR_FACE_REPO:$IMAGE_TAG

      - name: Render API Task Definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: fieldwork-api
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ github.sha }}

      - name: Deploy API to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render Face Service Task Definition
        id: render-face
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: fieldwork-face-service
          container-name: face-service
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FACE_REPO }}:${{ github.sha }}

      - name: Deploy Face Service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-face.outputs.task-definition }}
          service: ${{ env.FACE_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.API_SERVICE }} ${{ env.FACE_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "All ECS services are stable and healthy."

      - name: Run Automated AWS Deployment Tests
        env:
          TEST_USERNAME: ${{ secrets.TEST_API_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_API_PASSWORD }}
        run: |
          echo "Discovering ALB DNS name..."
          TG_ARN=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.API_SERVICE }} --query "services[0].loadBalancers[0].targetGroupArn" --output text)
          LB_ARN=$(aws elbv2 describe-target-groups --target-group-arns $TG_ARN --query "targetGroups[0].loadBalancerArns[0]" --output text)
          ALB_DNS=$(aws elbv2 describe-load-balancers --load-balancer-arns $LB_ARN --query "loadBalancers[0].dnsName" --output text)
          
          echo "Target ALB: http://$ALB_DNS"
          
          # 1. ALB Health Check (/health/ready)
          echo "Checking /health/ready..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health/ready)
          if [ "$HEALTH_STATUS" -ne 200 ]; then
            echo "Health check failed with status $HEALTH_STATUS"
            exit 1
          fi
          echo "ALB Readiness: PASS"

          # 2. Authentication Login (/api/Auth/login)
          echo "Testing Authentication..."
          LOGIN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://$ALB_DNS/api/Auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$TEST_USERNAME\", \"password\": \"$TEST_PASSWORD\"}")
          
          HTTP_CODE=$(echo "$LOGIN_RESPONSE" | tail -n1)
          BODY=$(echo "$LOGIN_Response" | sed '$d')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Login failed with status code $HTTP_CODE"
            exit 1
          fi
          
          # Extract token securely (masking from logs)
          TOKEN=$(echo "$BODY" | grep -o '"token":"[^"]*' | grep -o '[^"]*$')
          echo "Authentication: PASS"

          # 3. Authenticated /api/Auth/me Check
          echo "Testing /api/Auth/me..."
          ME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" http://$ALB_DNS/api/Auth/me)
          if [ "$ME_STATUS" -ne 200 ]; then
            echo "/api/Auth/me failed with status $ME_STATUS"
            exit 1
          fi
          echo "Auth/me: PASS"

          # 4. Automated Face Verification Test
          echo "Testing Face Verification via Service Connect..."
          TEST_IMAGE="FieldWork.Tests/TestData/personA_1.png"
          if [ -f "$TEST_IMAGE" ]; then
            FACE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://$ALB_DNS/api/Face/verify \
              -H "Authorization: Bearer $TOKEN" \
              -F "image=@$TEST_IMAGE")
            
            FACE_CODE=$(echo "$FACE_RESPONSE" | tail -n1)
            FACE_BODY=$(echo "$FACE_RESPONSE" | sed '$d')

            if [ "$FACE_CODE" -eq 200 ] && echo "$FACE_BODY" | grep -q "true"; then
              FACE_VERIFY_STATUS="PASS"
            else
              echo "Face verification response: $FACE_BODY"
              FACE_VERIFY_STATUS="FAIL"
              exit 1
            fi
          else
            echo "Test image not found at $TEST_IMAGE, skipping automated face payload check."
            FACE_VERIFY_STATUS="SKIPPED"
          fi

          # Print Portfolio Summary Block
          echo "================================="
          echo "FieldWork AWS Deployment Test"
          echo "================================="
          echo "ECS API              PASS"
          echo "ECS Face Service     PASS"
          echo "ALB readiness        PASS"
          echo "Authentication       PASS"
          echo "Auth/me              PASS"
          echo "Face verification    $FACE_VERIFY_STATUS"
          echo ""
          echo "Deployment successful."
          echo "================================="
