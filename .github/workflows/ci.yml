name: FieldWork CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FieldWork.slnx

      - name: Build
        run: dotnet build FieldWork.slnx --configuration Release --no-restore

      - name: Start integration test dependencies
        env:
          POSTGRES_PASSWORD: fieldwork_dev_pw
          JWT_SECRET_KEY: ci-test-secret-key-change-me
        run: |
          docker compose up -d --build db face-service

          echo "Waiting for PostgreSQL and face service..."

          for i in {1..60}; do
            DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' fieldwork-db 2>/dev/null || true)
            FACE_STATUS=$(docker inspect --format='{{.State.Health.Status}}' fieldwork-face-service 2>/dev/null || true)

            echo "PostgreSQL: $DB_STATUS | Face service: $FACE_STATUS"

            if [ "$DB_STATUS" = "healthy" ] && [ "$FACE_STATUS" = "healthy" ]; then
              echo "Both services are healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for integration test dependencies."
          docker compose ps
          docker compose logs db face-service
          exit 1


            - name: Verify integration test dependencies
        run: |
          echo "=== Docker Compose status ==="
          docker compose ps

          echo "=== PostgreSQL port ==="
          nc -zv 127.0.0.1 5433

          echo "=== Face service health ==="
          curl --fail --show-error http://127.0.0.1:8500/health/ready


      - name: Test
        run: dotnet test FieldWork.slnx --configuration Release --no-build

